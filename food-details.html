<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Classic Burger - Foodie</title>

    <link rel="stylesheet" href="assets/css/style.css">

</head>

<body>


    <!-- Header -->

    <header class="header">

        <div class="logo">
            Foodie
        </div>

        <nav class="navbar">

            <a href="index.html">Home</a>
            <a href="menu.html">Menu</a>
            <a href="#">About</a>
            <a href="#">Contact</a>
            <a href="#">Login</a>

        </nav>

    </header>


    <!-- Food Details -->

    <section class="food-details">

        <div class="food-details-image">

            <span>🍔</span>

        </div>


        <div class="food-details-info">

            <h1>Classic Burger</h1>

            <p class="food-details-price">
                Rs. 850
            </p>

            <p>
                Our Classic Burger is made with a juicy beef
                patty, fresh lettuce, tomato and cheese.
            </p>

            <p>
                It is served with fresh ingredients and
                our special burger sauce.
            </p>


            <!-- Quantity -->

            <div class="quantity">

                <label for="quantity">
                    Quantity:
                </label>

                <input
                    type="number"
                    id="quantity"
                    value="1"
                    min="1"
                >

            </div>


            <!-- Add Cart -->

            <button class="add-cart-button">
                Add to Cart
            </button>


            <br><br>


            <a href="menu.html" class="back-menu">
                ← Back to Menu
            </a>

        </div>

    </section>


    <!-- Footer -->

    <footer class="footer">

        <p>
            &copy; 2026 Foodie. All Rights Reserved.
        </p>

    </footer>


</body>

</html>
