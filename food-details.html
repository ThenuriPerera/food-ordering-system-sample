<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Classic Burger - Foodie</title>

    <link rel="stylesheet" href="assets/css/style.css">

</head>

<body>


    <!-- ============================= -->
    <!-- HEADER -->
    <!-- ============================= -->

    <header>

        <div class="logo">
            🍔 Foodie
        </div>

        <nav>

            <a href="index.html">Home</a>

            <a href="menu.html">Menu</a>

            <a href="food-details.html">Food Details</a>

            <a href="#">
                Cart (<span id="cartCount">0</span>)
            </a>

        </nav>

    </header>


    <!-- ============================= -->
    <!-- FOOD DETAILS -->
    <!-- ============================= -->

    <section class="food-details">

        <div class="food-details-image">

            <div class="food-image">
                🍔
            </div>

        </div>


        <div class="food-details-info">

            <h1>Classic Burger</h1>

            <p class="food-details-price">
                Rs. 850
            </p>

            <p>
                A delicious classic burger made with a juicy
                beef patty, fresh vegetables and our special sauce.
            </p>


            <!-- QUANTITY -->

            <div class="quantity">

                <label for="quantity">
                    Quantity:
                </label>

                <button
                    type="button"
                    id="decrease">
                    -
                </button>

                <input
                    type="number"
                    id="quantity"
                    value="1"
                    min="1">

                <button
                    type="button"
                    id="increase">
                    +
                </button>

            </div>


            <!-- ADD TO CART -->

            <button
                class="add-cart-button"
                id="addToCart"
                type="button">

                Add to Cart

            </button>


            <br><br>


            <!-- BACK TO MENU -->

            <a
                href="menu.html"
                class="back-menu">

                ← Back to Menu

            </a>

        </div>

    </section>


    <!-- ============================= -->
    <!-- FOOTER -->
    <!-- ============================= -->

    <footer>

        <p>
            &copy; 2026 Foodie. All Rights Reserved.
        </p>

    </footer>


    <!-- JAVASCRIPT -->

    <script src="assets/js/script.js"></script>

</body>

</html>
